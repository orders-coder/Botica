server {
  listen 80;
  listen [::]:80;
  server_name boticasf.com www.boticasf.com;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain font/woff2;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  error_page 404 /404.html;

  location = /subscribe {
    default_type text/plain;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    return 501 'This signup endpoint is a placeholder. Point it at your mailing list before opening.\n';
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }

  location ~* \.(?:css|js|woff2|svg|png|jpe?g|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
